<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="Neuromente, naar de homepage">
      <img class="brand-mark" src="{{ "images/logo-neuromente.png" | relURL }}" alt="" width="1050" height="1050">
      <span>neuromente</span>
    </a>
    <button class="menu-trigger" type="button" aria-expanded="false" aria-controls="site-nav" data-menu-trigger>
      <span>Menu</span><i aria-hidden="true"></i>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Hoofdnavigatie" data-menu data-open="false">
      {{ range site.Menus.main }}
        <a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }} class="{{ if eq .Name "Aanmelden" }}nav-cta{{ end }}">{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
